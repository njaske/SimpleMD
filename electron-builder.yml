appId: com.simplemd.app
productName: SimpleMD
copyright: Copyright © 2026 njaske
publish:
  provider: github
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
  - package.json
# Harden the packaged Electron binary: no running it as plain Node, no
# NODE_OPTIONS / --inspect injection, and only load the integrity-checked asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: SimpleMD
  artifactName: ${productName}-Setup.${ext}
portable:
  artifactName: ${productName}-portable.${ext}
