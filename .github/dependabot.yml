version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      codemirror:
        patterns: ['@codemirror/*', '@lezer/*', 'codemirror']
      # Vite majors only work with a matching electron-vite, so update them together.
      build-tooling:
        patterns: ['vite', 'electron-vite', '@vitejs/*']
      # react and react-dom must always be on the same version.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      # Mermaid bundles its own KaTeX; keep the two on compatible versions.
      rendering:
        patterns: ['mermaid', 'katex']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
