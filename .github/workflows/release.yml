name: Release

# Build Windows, macOS and Linux packages when a version tag is pushed.
#   git tag v1.1.0 && git push origin v1.1.0
# Every OS uploads into the same DRAFT release, then one job adds a combined
# SHA256SUMS.txt. Review the draft, then publish it manually.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the draft release
    steps:
      # Create the draft up front: otherwise the parallel uploads race and
      # electron-builder splits the assets across several drafts.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 \
            || gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
                 --verify-tag --title "${GITHUB_REF_NAME#v}" --notes "SimpleMD ${GITHUB_REF_NAME}"

  package:
    name: package (${{ matrix.os }})
    needs: draft
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: --win
          - os: macos-latest
            platform: --mac
          - os: ubuntu-latest
            platform: --linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write # upload assets to the draft release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      # fpm needs rpmbuild for the .rpm target.
      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Package and upload to draft release
        run: npx --no-install electron-builder ${{ matrix.platform }} --publish always
        env:
          # Built-in token; no code-signing certificate is used yet.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Don't pick up a stray keychain identity on the macOS runner; the
          # Apple Silicon build is still ad-hoc signed so it launches.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  checksums:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload SHA256SUMS.txt
    steps:
      # Hash what is actually attached to the release, for every OS at once.
      - name: Publish combined SHA-256 checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir release-files && cd release-files
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --pattern '*.exe' --pattern '*.dmg' --pattern '*.zip' \
            --pattern '*.AppImage' --pattern '*.deb' --pattern '*.rpm'
          sha256sum -- * | tee ../SHA256SUMS.txt
          cd ..
          gh release upload "${GITHUB_REF_NAME}" SHA256SUMS.txt --repo "${GITHUB_REPOSITORY}" --clobber
